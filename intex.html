<!DOCTYPE html>
<html>
<head>
<title>JavaScript Fundatmentals</title>
<style>
*{
font-family:"Lexend_Deca_Medium";
}
body {
height:200vh;
 }
section{
position : fixed;
}
p {
font-size :3rem;
}

</style>
</head>
<body onscroll="showCount()" >

<h1>Throttle Example</h1>
  <section>
   <p class="n_count"> Normal Count</p>
   <p class="t_count"> Throttle Count</p>
  </section>
<script>
  const  normal_div = document.querySelector('.n_count');
  const  throttle_div = document.querySelector('.t_count');
 let n_count = 0;
let t_count = 0;
 let isScrolling = true;
 const normalCount =()=>{
n_count++;
normal_div.innerHTML =`Normal Count : ${n_count}`;
}
const showCount = () => {
  normalCount();
  throttleCount();
}
const  throttleCount = () => {
  if(isScrolling === true) {
    t_count++;
    throttle_div.innerHTML =`Normal Count : ${t_count}`;
    isScrolling  = false;
   setTimeout(() =>{
   isScrolling  = true;
  },1000);
  }

}
  </script>

</body>
</html>
